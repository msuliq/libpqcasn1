name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          - os: macos-latest
            compiler: gcc
          - os: windows-latest
            compiler: gcc
        include:
          - os: windows-latest
            compiler: msvc
            build_type: Debug
          - os: windows-latest
            compiler: msvc
            build_type: Release
    name: Test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }})
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      build_type: ${{ matrix.build_type }}

  coverage:
    name: Code Coverage
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-latest
      compiler: gcc
      build_type: Debug
      enable_coverage: true

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build fuzzer
        env:
          CC: clang
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
                -Iinclude -Isrc fuzz/fuzz_decode.c src/tlv.c src/builder.c \
                src/parser.c src/base64.c src/pem.c -o fuzz/fuzz_decode

      - name: Run fuzzer (60 seconds)
        run: |
          mkdir -p fuzz/corpus
          ./fuzz/fuzz_decode -max_total_time=60 -max_len=4096 fuzz/corpus

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tools

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            src/ include/ || true

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake for clang-tidy
        working-directory: build
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPQC_ASN1_BUILD_TESTS=ON

      - name: Build
        working-directory: build
        run: cmake --build .

      - name: Run clang-tidy
        working-directory: build
        run: |
          clang-tidy \
            -p . \
            ../src/tlv.c \
            ../src/builder.c \
            ../src/parser.c \
            ../src/base64.c \
            ../src/pem.c \
            || true

  pkg-config:
    name: Package Config Verification
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-latest
      compiler: gcc
      build_type: Release
      build_tests: false

  verify-pkg-config:
    name: Verify pkg-config
    runs-on: ubuntu-latest
    needs: pkg-config

    steps:
      - uses: actions/checkout@v6

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        working-directory: build
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPQC_ASN1_BUILD_TESTS=OFF

      - name: Build
        working-directory: build
        run: cmake --build .

      - name: Verify pkg-config file
        working-directory: build
        run: |
          ls -la pqc_asn1.pc
          cat pqc_asn1.pc
          # Verify essential fields are present
          grep -q "^Name:" pqc_asn1.pc
          grep -q "^Version:" pqc_asn1.pc
          grep -q "^Description:" pqc_asn1.pc
          grep -q "^Libs:" pqc_asn1.pc
          grep -q "^Cflags:" pqc_asn1.pc
          echo "pkg-config file is valid"
