name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and test (Make)
        env:
          CC: ${{ matrix.compiler }}
        run: |
          make clean
          make test

      - name: Build and test (CMake)
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cmake -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          cmake --build build
          ctest --test-dir build --output-on-failure

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test (CMake + MSVC)
        run: |
          cmake -B build
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure -C Release
