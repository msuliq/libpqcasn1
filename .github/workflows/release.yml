name: Auto Release on Merge

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  # ============================================================
  # VERSION DETECTION
  # ============================================================
  detect-version:
    name: Detect version from merge
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      is-release: ${{ steps.detect.outputs.is-release }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect version from VERSION file
        id: detect
        run: |
          # Get current version from VERSION file
          CURRENT_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Detected version: v$CURRENT_VERSION"

          # Check if release already exists on GitHub for this version
          RELEASE_EXISTS=$(gh release view "v$CURRENT_VERSION" 2>/dev/null && echo "true" || echo "false")

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            # Release already published for this version
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "Release v$CURRENT_VERSION already published. Skipping."
          else
            # No release published yet for this version - proceed
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "No published release found for v$CURRENT_VERSION. Will create release."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # CREATE GIT TAG
  # ============================================================
  create-tag:
    name: Create release tag
    needs: detect-version
    if: needs.detect-version.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push tag
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete existing tag if it exists (from failed release attempt)
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Deleting existing tag: v$VERSION"
            git tag -d "v$VERSION"
            git push origin --delete "v$VERSION" || true
          fi

          # Create and push new tag
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "Created and pushed tag: v$VERSION"

  # ============================================================
  # BUILD & PACKAGE ARTIFACTS
  # ============================================================
  build-and-release:
    name: Build and release artifacts
    needs: [detect-version, create-tag]
    if: needs.detect-version.outputs.is-release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Create release artifacts
        run: |
          prefix="libpqcasn1-${{ needs.detect-version.outputs.version }}"
          mkdir -p dist

          # Create tarball with clean source tree
          tar czf "dist/${prefix}.tar.gz" \
            --transform="s,^,${prefix}/," \
            include/pqc_asn1.h \
            src/pqc_asn1.c \
            test/test_pqc_asn1.c \
            CMakeLists.txt \
            Makefile \
            pqc_asn1.pc.in \
            VERSION \
            LICENSE-MIT \
            LICENSE-APACHE

      - name: Compute checksums
        run: |
          cd dist
          sha256sum libpqcasn1-${{ needs.detect-version.outputs.version }}.tar.gz > libpqcasn1-${{ needs.detect-version.outputs.version }}.tar.gz.sha256
          cat libpqcasn1-${{ needs.detect-version.outputs.version }}.tar.gz.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cd dist
          cosign sign-blob --yes \
            libpqcasn1-${{ needs.detect-version.outputs.version }}.tar.gz \
            > libpqcasn1-${{ needs.detect-version.outputs.version }}.tar.gz.sig

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/libpqcasn1-${{ needs.detect-version.outputs.version }}.sbom.json
          upload-artifact: false

      - name: Validate artifacts
        run: |
          TEST_DIR=$(mktemp -d)
          tar -xzf dist/libpqcasn1-${{ needs.detect-version.outputs.version }}.tar.gz -C "$TEST_DIR"
          test -f "$TEST_DIR/libpqcasn1-${{ needs.detect-version.outputs.version }}/include/pqc_asn1.h" || (echo "Missing pqc_asn1.h"; exit 1)
          test -f "$TEST_DIR/libpqcasn1-${{ needs.detect-version.outputs.version }}/CMakeLists.txt" || (echo "Missing CMakeLists.txt"; exit 1)
          echo "✓ Artifact validation passed"
          rm -rf "$TEST_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30

  # ============================================================
  # PUBLISH RELEASE
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    needs: [detect-version, build-and-release]
    if: needs.detect-version.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="v${{ needs.detect-version.outputs.version }}"
          # Extract changelog section for this version
          CHANGELOG=$(sed -n "/^## \[$VERSION/,/^## \[/p" CHANGELOG.md | head -n -1)

          if [[ -z "$CHANGELOG" ]]; then
              CHANGELOG="See commits for details"
          fi

          # Handle multiline in GitHub Actions
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "body=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release-artifacts/*
          body: |
            ${{ steps.changelog.outputs.body }}

            ## Verify artifact authenticity

            **Verify Cosign signature:**
            ```sh
            cosign verify-blob \
              --bundle=libpqcasn1-v${{ needs.detect-version.outputs.version }}.tar.gz.sig \
              libpqcasn1-v${{ needs.detect-version.outputs.version }}.tar.gz
            ```

            **Verify SHA256 checksum:**
            ```sh
            sha256sum -c libpqcasn1-v${{ needs.detect-version.outputs.version }}.tar.gz.sha256
            ```

            **View Software Bill of Materials (SBOM):**
            See `libpqcasn1-v${{ needs.detect-version.outputs.version }}.sbom.json` for the full SBOM in SPDX JSON format.

            ## Build information

            - Source: [libpqcasn1](https://github.com/${{ github.repository }})
            - Tag: v${{ needs.detect-version.outputs.version }}
          tag_name: v${{ needs.detect-version.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
